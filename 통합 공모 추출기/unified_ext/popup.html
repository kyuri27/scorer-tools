<!DOCTYPE html>
<html lang="ko">
<head>

<link rel="stylesheet" href="popup.css">

      <p id="headerSub">공모 상세 페이지에서 정보를 자동 추출합니다</p>
    </div>
    <button class="icon-btn" id="settingsBtn" title="API 키 설정">⚙️</button>

</div>
<div id="settingsPanel" class="settings-panel hidden">

    <input type="password" id="apiKeyInput" placeholder="API 키 입력" />

  </div>
  <div id="apiKeyStatus" class="api-key-status"></div>
</div>
<div class="body">
  <div id="main"></div>
</div>
<div class="footer">
  <div>updated <span id="buildDate"></span></div>
  <div>created by 김규리 · 2026.05</div>
</div>
